<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Standard Reserve — protocol overview</title>
<style>
  body {
    margin: 0;
    padding: 32px 16px;
    background: #F1EFE8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #2C2C2A;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .wrap { max-width: 720px; width: 100%; }
  h1 { font-size: 20px; font-weight: 500; margin: 0 0 4px; }
  p.sub { color: #5F5E5A; font-size: 14px; margin: 0 0 24px; }
  svg { width: 100%; height: auto; display: block; background: #FFFFFF; border-radius: 12px; }
  .node { cursor: pointer; transition: opacity 0.15s; }
  .node:hover { opacity: 0.85; }
  .node.active rect { stroke-width: 2.5; }
  #panel {
    margin-top: 20px;
    background: #FFFFFF;
    border: 1px solid #D3D1C7;
    border-radius: 12px;
    padding: 20px 24px;
    min-height: 70px;
    font-size: 14px;
    line-height: 1.6;
  }
  #panel .title { font-weight: 500; font-size: 15px; margin-bottom: 6px; }
  #panel .placeholder { color: #888780; }
  .legend { margin-top: 14px; font-size: 12px; color: #5F5E5A; }
</style>
</head>
<body>
<div class="wrap">
  <h1>The Standard Reserve — protocol overview</h1>
  <p class="sub">Click a box to see its explanation below.</p>

  <svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#3C3489" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <g class="node" data-id="charter">
      <rect x="50" y="60" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
      <text x="140" y="78" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C">Get a charter</text>
      <text x="140" y="96" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">Genesis: free</text>
    </g>

    <g class="node" data-id="branch">
      <rect x="250" y="60" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
      <text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C">Open a branch</text>
      <text x="340" y="96" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">Automatic, earns rewards</text>
    </g>

    <g class="node" data-id="expand">
      <rect x="450" y="60" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
      <text x="540" y="78" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C">Expand</text>
      <text x="540" y="96" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">Auction, token burned</text>
    </g>

    <line x1="230" y1="88" x2="250" y2="88" stroke="#3C3489" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="430" y1="88" x2="450" y2="88" stroke="#3C3489" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="540" y1="116" x2="540" y2="206" stroke="#3C3489" stroke-width="1.5" marker-end="url(#arrow)"/>

    <g class="node" data-id="ethsignal">
      <rect x="450" y="206" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
      <text x="540" y="224" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">Net ETH signal</text>
      <text x="540" y="242" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">Sets issuance rate</text>
    </g>

    <g class="node" data-id="close">
      <rect x="250" y="206" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
      <text x="340" y="224" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C">Retire the branch</text>
      <text x="340" y="242" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">Exit fee applies</text>
    </g>

    <g class="node" data-id="burn">
      <rect x="50" y="206" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
      <text x="140" y="224" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C">Charter burns</text>
      <text x="140" y="242" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">When last branch closes</text>
    </g>

    <line x1="450" y1="234" x2="430" y2="234" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="250" y1="234" x2="230" y2="234" stroke="#3C3489" stroke-width="1.5" marker-end="url(#arrow)"/>

    <path d="M48,262 C10,262 10,88 48,88" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  </svg>

  <div class="legend">Purple: charter lifecycle · Teal: tokenomics engine · dashed arrow: restart via a new auction</div>

  <div id="panel">
    <div class="placeholder">Click a box above to see its explanation here.</div>
  </div>
</div>

<script>
  const explanations = {
    charter: {
      title: "Get a charter",
      text: "A charter works like a banking license. Only 1,000 exist in the genesis round, distributed for free as soulbound (non-transferable) NFTs. After genesis, getting a new charter requires bidding in a separate daily ETH auction."
    },
    branch: {
      title: "Open a branch",
      text: "Every charter automatically gives you one branch. That branch accrues your share of whatever $STANDARD the protocol issues each epoch. Rewards aren't sent to your wallet immediately — they accumulate inside the charter's internal balance."
    },
    expand: {
      title: "Expand",
      text: "A single charter can grow up to 10 branches. Each new branch requires an expansion license, sold in a daily Dutch auction priced in $STANDARD — and whatever gets spent there is burned entirely."
    },
    ethsignal: {
      title: "Net ETH signal",
      text: "The protocol's only policy input is net ETH flow through the official ETH/$STANDARD Uniswap v4 pool. This single signal feeds three decisions at three different speeds: fee routing (near-instant), issuance rate (2-epoch lag), and exit fee (7-day window)."
    },
    close: {
      title: "Retire the branch",
      text: "To cash out, you retire (close) a branch. Your share lands in your wallet, minus an exit fee — half of that fee is burned, half goes to the bankers who stayed in the system."
    },
    burn: {
      title: "Charter burns",
      text: "Retire your last branch and the charter itself burns. Getting back in isn't free like genesis was — you'd need to win a fresh charter in the daily ETH auction."
    }
  };

  const nodes = document.querySelectorAll(".node");
  const panel = document.getElementById("panel");

  nodes.forEach(node => {
    node.addEventListener("click", () => {
      nodes.forEach(n => n.classList.remove("active"));
      node.classList.add("active");
      const id = node.getAttribute("data-id");
      const info = explanations[id];
      if (info) {
        panel.innerHTML = '<div class="title">' + info.title + '</div><div>' + info.text + '</div>';
      }
    });
  });
</script>
</body>
</html>
