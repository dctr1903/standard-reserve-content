<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>The Standard Reserve protocol — overview flow</title>
<desc>Diagram showing the charter/branch lifecycle (get a charter, open a branch, expand, retire, restart via auction) and the net ETH flow signal that governs it</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#3C3489" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect width="680" height="340" fill="#FFFFFF"/>

<g>
<rect x="50" y="60" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="140" y="78" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Get a charter</text>
<text x="140" y="96" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">Genesis: free</text>
</g>

<g>
<rect x="250" y="60" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Open a branch</text>
<text x="340" y="96" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">Automatic, accrues rewards</text>
</g>

<g>
<rect x="450" y="60" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="540" y="78" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Expand</text>
<text x="540" y="96" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">Auction, token burned</text>
</g>

<line x1="230" y1="88" x2="250" y2="88" stroke="#3C3489" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="430" y1="88" x2="450" y2="88" stroke="#3C3489" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="540" y1="116" x2="540" y2="206" stroke="#3C3489" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="450" y="206" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="540" y="224" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Net ETH signal</text>
<text x="540" y="242" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Sets issuance rate</text>
</g>

<g>
<rect x="250" y="206" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="224" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Retire branch</text>
<text x="340" y="242" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">Exit fee applies</text>
</g>

<g>
<rect x="50" y="206" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="140" y="224" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Charter burns</text>
<text x="140" y="242" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">When last branch closes</text>
</g>

<line x1="450" y1="234" x2="430" y2="234" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="250" y1="234" x2="230" y2="234" stroke="#3C3489" stroke-width="1.5" marker-end="url(#arrow)"/>

<path d="M48,262 C10,262 10,88 48,88" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<text x="40" y="300" text-anchor="start" font-family="sans-serif" font-size="12" fill="#5F5E5A">Purple: charter lifecycle · Teal: tokenomics engine · dashed arrow: restarts via a new auction</text>
</svg>
